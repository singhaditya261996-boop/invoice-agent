name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev]"
      # Includes the invariant that the committed dataset still matches the generator,
      # and the end-to-end check that no problem invoice is ever auto-approved.
      - run: pytest -q

      # The safety properties are enforced by the pipeline, not by remembering to check them.
      - name: Evaluation gate — all 500 invoices, rules only
        run: python -m eval.run_eval --mode offline --check
      - name: Evaluation gate — half the invoices deliberately misread
        run: python -m eval.run_eval --simulate-extraction-errors 0.5 --check --name ci-robustness

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # type-check and production build
